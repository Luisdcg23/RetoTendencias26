<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DigiPermit – Acceso</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      .gradient-bar { height: 4px; width: 100%; background: linear-gradient(90deg, #1d4ed8, #06b6d4); position: fixed; top: 0; left: 0; z-index: 100; }
      .auth-page { min-height: 100vh; display: flex; flex-direction: column; }
      .auth-center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; padding-top: 48px; }
      .auth-card { width: 100%; max-width: 420px; }
      .auth-logo { display: flex; justify-content: center; margin-bottom: 12px; }
      .auth-logo img { height: 180px; width: auto; object-fit: contain; }
      .auth-footer { text-align: center; padding: 16px; color: var(--dp-fg-5); font-size: 11px; }
      .error-box { display: none; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; background: var(--red-dim); border: 1px solid rgba(248,113,133,0.3); color: var(--red); font-size: 12px; }
      .success-box { display: none; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; background: var(--cyan-dim); border: 1px solid rgba(34,211,238,0.3); color: var(--cyan); font-size: 12px; }
      .btn-full { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
      .link-btn { background: none; border: none; padding: 0; min-height: unset; color: var(--cyan); font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
      .text-center { text-align: center; }
      .text-muted { color: var(--dp-fg-5); font-size: 12px; margin: 0; }
      .theme-toggle { position: fixed; top: 14px; right: 16px; z-index: 200; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--dp-border); background: var(--dp-surface); color: var(--dp-fg-3); cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: unset; padding: 0; }
      .theme-toggle:hover { border-color: var(--cyan); color: var(--cyan); }
      body.light { --dp-page: #eef4ff; --dp-surface: #ffffff; --dp-surface-2: #ddeafb; --dp-border: rgba(14,42,100,0.12); --dp-border-med: rgba(14,42,100,0.18); --dp-fg-1: #0a1628; --dp-fg-2: #1e3a5f; --dp-fg-3: #3b5a82; --dp-fg-4: #5b7da8; --dp-fg-5: #8baac8; --dp-overlay-sm: rgba(14,42,100,0.04); }
    </style>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div class="gradient-bar"></div>
    <button class="theme-toggle" id="themeToggle" title="Cambiar tema"></button>

    <div class="auth-page">
      <div class="auth-center">
        <div class="auth-card">
          <div class="auth-logo">
            <img src="/logo.png" alt="DigiPermit – Digital Licensing System">
          </div>

          <div class="panel auth-panel">
            <div class="auth-tabs">
              <button type="button" class="auth-tab active" data-tab="login">Iniciar sesión</button>
              <button type="button" class="auth-tab" data-tab="register">Crear cuenta</button>
            </div>

            <div class="auth-tab-content active" id="loginTab">
              <form id="loginForm" class="login-form">
                <label>
                  Correo electrónico
                  <input name="correo" type="email" placeholder="usuario@empresa.com" autocomplete="email" required>
                </label>
                <label>
                  Contraseña
                  <input name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                </label>
                <div id="loginError" class="error-box"></div>
                <button class="primary btn-full" type="submit">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                  Iniciar sesión
                </button>
                <p class="text-center text-muted">
                  ¿No tienes cuenta?
                  <button type="button" class="link-btn" onclick="switchTab('register')">Regístrate gratis</button>
                </p>
              </form>
            </div>

            <div class="auth-tab-content" id="registerTab">
              <form id="registerForm" class="login-form">
                <label>
                  Nombre completo
                  <input name="nombre_completo" type="text" placeholder="Ana García" required>
                </label>
                <label>
                  Correo electrónico
                  <input name="correo" type="email" placeholder="ana@empresa.com" required>
                </label>
                <label>
                  Contraseña
                  <input name="password" type="password" placeholder="Mínimo 8 caracteres" required>
                </label>
                <label>
                  Tipo de cuenta
                  <select name="tipo_usuario">
                    <option value="Individual">Individual</option>
                    <option value="Empresa">Empresa</option>
                    <option value="Admin">Admin</option>
                  </select>
                </label>
                <div id="registerError" class="error-box"></div>
                <div id="registerSuccess" class="success-box"></div>
                <button class="primary btn-full" type="submit">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                  Crear cuenta
                </button>
                <p class="text-center text-muted">
                  ¿Ya tienes cuenta?
                  <button type="button" class="link-btn" onclick="switchTab('login')">Inicia sesión</button>
                </p>
              </form>
            </div>
          </div>

          <p class="auth-footer">DigiPermit · Digital Licensing System · Reto Mayo–Julio 2026</p>
        </div>
      </div>
    </div>

    <script>
      function switchTab(tab) {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-tab-content').forEach(t => t.classList.remove('active'));
        document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
        document.getElementById(tab + 'Tab').classList.add('active');
      }
      document.querySelectorAll('.auth-tab').forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.dataset.tab));
      });
    </script>
    <script src="/login.js"></script>
  </body>
</html>
